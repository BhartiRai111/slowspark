spring:
  application:
    name: slowspark-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slowspark}
    username: ${DB_USER:slowspark}
    password: ${DB_PASSWORD:slowspark}
  jpa:
    hibernate:
      # Tables come from Flyway SQL files; Hibernate only checks they match the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be at least 32 characters. Set a long random value in production.
    secret: ${JWT_SECRET:change-me-this-is-a-local-dev-secret-key-123456}
    expiry-days: 30
  firebase:
    # Path to the Firebase service account JSON (download from Firebase console).
    credentials-path: ${FIREBASE_CREDENTIALS:}
  auth:
    # Lets you log in with just a phone number while testing locally. Keep false in production.
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  date-ready:
    min-days-after-match: 7
    min-messages: 20
    answer-window-hours: 48
    request-expiry-days: 7
